<!--
  Кнопка композера с ТОЧНОЙ версией "3.6 Flash" (v50: после выбора модели из
  меню Gemini пишет номер версии прямо в кнопку). Ожидание probeGeminiUiButton:
  точное имя возвращается как есть, кэш семьи 'flash' обновляется этим именем,
  resolveFamilyVariantId не вызывается.
-->
<div class="input-area-container">
  <button type="button" class="input-area-switch" aria-label="Выбор модели">
    <span class="label">3.6</span>
    <span class="label">Flash</span>
  </button>
</div>
