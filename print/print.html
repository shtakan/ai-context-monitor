<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Context Monitor — печатная форма</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #1f1f1f;
    background: #ffffff;
    margin: 0;
    padding: 0;
    line-height: 1.55;
  }
  .print-wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
  .doc-header {
    border-bottom: 2px solid #7c3aed;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .doc-header h1 { margin: 0 0 8px; font-size: 22px; color: #111; }
  .doc-meta { font-size: 13px; color: #555; line-height: 1.6; }
  .doc-meta b { color: #222; }

  .msg-block {
    border: 1px solid #e3e3e8;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .msg-block.user { background: #f6f7fb; }
  .msg-block.assistant { background: #ffffff; }
  .msg-role {
    font-size: 12px;
    font-weight: 600;
    color: #7c3aed;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .msg-body { font-size: 14px; word-wrap: break-word; }

  h1, h2, h3, h4, h5, h6 { margin: 14px 0 8px; line-height: 1.3; }
  h1 { font-size: 20px; } h2 { font-size: 18px; } h3 { font-size: 16px; }
  h4, h5, h6 { font-size: 14px; }
  p { margin: 8px 0; }
  ul, ol { margin: 8px 0; padding-left: 24px; }
  li { margin: 3px 0; }
  code {
    background: #f1f0f7;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 13px;
  }
  pre {
    background: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  pre code { background: transparent; padding: 0; font-size: 13px; }
  pre[data-lang]::before {
    content: attr(data-lang);
    display: block;
    font-size: 11px;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  table {
    border-collapse: collapse;
    margin: 12px 0;
    width: auto;
    max-width: 100%;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #d5d5de;
    padding: 6px 10px;
    text-align: left;
  }
  th { background: #f1f0f7; }
  a { color: #7c3aed; word-break: break-all; }

  .empty-state {
    text-align: center;
    color: #666;
    padding: 48px 0;
    font-size: 15px;
  }
  .banner { display: none; }

  @media print {
    body { background: #ffffff; }
    .print-wrap { max-width: none; padding: 0; }
    .doc-header { break-after: avoid; }
    .msg-block { break-inside: avoid; }
    pre, table { break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
    @page { margin: 16mm 14mm; }
  }
</style>
</head>
<body>
  <div class="print-wrap">
    <div class="banner" id="print-banner">Форма готова — диалог печати будет вызван автоматически.</div>
    <div id="print-content"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      История для этой вкладки не найдена. Откройте чат на поддерживаемой платформе и попробуйте ещё раз.
    </div>
  </div>
  <script src="../utils/markdown.js"></script>
  <script src="print.js"></script>
</body>
</html>
