name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Phase 2 step 2: пакет собирается из бандлов (esbuild, 4 entry point).
      # Сборка обязана пройти ДО упаковки: build.mjs сам верифицирует результат
      # (verify + verifyDist) и падает, если dist/ неполон или остался legacy-вход.
      # build:prod (--minify, без sourcemap) — релизный артефакт: пакет без карт
      # исходников и вдвое меньше dev-сборки.
      - name: Build bundles
        run: npm run build:prod

      - name: Create ZIP
        run: |
          ZIP="ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip"
          # v51 (PK1): собираем ТОЛЬКО из трекаемых файлов (git ls-files); исключения —
          # фильтром на стороне git/grep, файлы передаются zip аргументами, -x не используется.
          # v1.19 (M-6): docs/ больше НЕ исключается — руководство (docs/index.html) и
          # скриншоты входят в пакет, чтобы ссылка «Помощь» в настройках работала офлайн.
          # v1.18 (LOW-5, вариант Б): README.md в ZIP НЕ включается — \.md$ сохранён осознанно.
          # Магазин Edge Add-ons берёт описание из листинга Partner Center (не из пакета),
          # поэтому README в пакете не нужен; внутренняя документация (ARCHITECTURE_STANDARDS,
          # RELEASE_*) тоже не должна уезжать пользователю. Офлайн-руководство — docs/index.html.
          # v1.19.3 (CI-хотфикс): \.gitattributes исключён наравне с \.gitignore —
          # правило нормализации EOL нужно репозиторию, а не пользовательскому пакету.
          # v2.0.14 (Phase 2 step 2): из пакета убраны build-артефакты репозитория —
          # сборщик (\.mjs$) и конфиг tsc (tsconfig\.json$) нужны репозиторию, а не
          # пользователю, и в рантайме расширения не участвуют.
          # Phase 3 step 1: dist/ стал самодостаточным, поэтому legacy-дерево исходников
          # уходит из пакета. ^core/ и ^utils/ безопасны: все их файлы либо склеены в
          # бандлы, либо перечислены в runtimeRegisteredFiles() и попадают в ZIP оверлеем
          # dist/ (16 MAIN-world файлов, которые service worker регистрирует сам).
          # options/options\.js$ исключён как единственный бандлируемый файл под options/;
          # options/i18n-apply.js ОСТАЁТСЯ — его грузят напрямую privacy/privacy.html и
          # docs/index.html. print/print\.js$ исключён: оверлей кладёт бандл в корень (print.js),
          # а print/print.html остаётся и подменяется rewired-копией из dist/.
          git ls-files -z | grep -zvE '(\.github/|\.gitignore|\.gitattributes|\.clineignore|tools/|tests/|^core/|^utils/|^adapters/|^options/options\.js$|^print/print\.js$|\.kilo/|coverage/|\.mjs$|tsconfig\.json$|\.md$|package(-lock)?\.json$)' | xargs -0 zip -q "$ZIP"
          # v2.0.14 (Phase 2 step 2): поверх legacy-дерева кладём собранные бандлы.
          # Пути передаются так же — относительно корня репозитория, поэтому
          # одноимённые записи (manifest.json, options/options.html, print/print.html)
          # ЗАМЕНЯЮТ legacy-копии, а бандлы (background.js, content.js, options.js,
          # print.js) и _locales/ появляются в корне пакета. Именно rewired-копии
          # manifest.json, options/options.html и print/print.html определяют, что
          # запускает Chrome: 4 бандла + 16 MAIN-world файлов, которые service worker
          # регистрирует сам.
          # Файлы перечисляются find-ом (а не 'zip -r dist'), чтобы записи в архиве
          # гарантированно не получили префикс 'dist/' и совпали с legacy-именами.
          ( cd dist && find . -type f ) | sed 's|^\./||' | xargs zip -q "$ZIP"

      - name: Verify ZIP contents
        run: |
          # v1.19 (M-6): пост-шаг контроля состава пакета. Печатаем полный листинг ZIP
          # и падаем, если внутрь просочились служебные пути (tests/, node_modules/,
          # .git/, package-lock.json). Дополнительно требуем наличие руководства:
          # без docs/index.html ссылка «Помощь» в options-футере неработоспособна.
          ZIP="ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip"
          unzip -l "$ZIP"
          echo "--- forbidden paths ---"
          if unzip -Z1 "$ZIP" | grep -E '(^|/)(tests|node_modules|\.git)/|(^|/)package-lock\.json$'; then
            echo "::error::ZIP содержит запрещённые пути (tests/, node_modules/, .git/, package-lock.json)"
            exit 1
          fi
          echo "--- required guide ---"
          if ! unzip -Z1 "$ZIP" | grep -qx 'docs/index.html'; then
            echo "::error::в ZIP нет docs/index.html — руководство недоступно из расширения"
            exit 1
          fi
          echo "OK: состав пакета $ZIP проверен"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}