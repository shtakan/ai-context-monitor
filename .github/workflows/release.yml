name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          # v51 (PK1): собираем ТОЛЬКО из трекаемых файлов (git ls-files); исключения —
          # фильтром на стороне git/grep, файлы передаются zip аргументами, -x не используется.
          git ls-files -z | grep -zvE '(\.github/|\.gitignore|\.clineignore|tools/|tests/|\.kilo/|docs/|coverage/|\.md$|package(-lock)?\.json$)' | xargs -0 zip -q "ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}