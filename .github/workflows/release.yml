name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version from manifest.json
        run: |
          node -e "const m = require('./manifest.json'); require('fs').appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + m.version + '\n')"

      - name: Create ZIP archive
        run: |
          zip -r "ai-context-monitor-v${VERSION}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".gitignore" \
            -x "package.json" \
            -x "package-lock.json"

      - name: Upload ZIP as release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./ai-context-monitor-v${VERSION}.zip
          asset_name: ai-context-monitor-v${VERSION}.zip
          asset_content_type: application/zip