name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          zip -r "ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip" . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" "docs/*" "coverage/*" \
            -x "*.md" ".gitignore" "package.json" "package-lock.json"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}