name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Phase 2 step 2: пакет собирается из бандлов (esbuild, 5 entry point).
      # Сборка обязана пройти ДО упаковки: build.mjs сам верифицирует результат
      # (verify + verifyDist) и падает, если dist/ неполон или остался legacy-вход.
      # build:prod (--minify, без sourcemap) — релизный артефакт: пакет без карт
      # исходников и вдвое меньше dev-сборки.
      - name: Build bundles
        run: npm run build:prod

      - name: Create ZIP
        run: |
          ZIP="ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip"
          # v51 (PK1): собираем ТОЛЬКО из трекаемых файлов (git ls-files); исключения —
          # фильтром на стороне git/grep, файлы передаются zip аргументами, -x не используется.
          # v1.19 (M-6): docs/ больше НЕ исключается — руководство (docs/index.html) и
          # скриншоты входят в пакет, чтобы ссылка «Помощь» в настройках работала офлайн.
          # v1.18 (LOW-5, вариант Б): README.md в ZIP НЕ включается — \.md$ сохранён осознанно.
          # Магазин Edge Add-ons берёт описание из листинга Partner Center (не из пакета),
          # поэтому README в пакете не нужен; внутренняя документация (ARCHITECTURE_STANDARDS,
          # RELEASE_*) тоже не должна уезжать пользователю. Офлайн-руководство — docs/index.html.
          # v1.19.3 (CI-хотфикс): \.gitattributes исключён наравне с \.gitignore —
          # правило нормализации EOL нужно репозиторию, а не пользовательскому пакету.
          # v2.0.14 (Phase 2 step 2): из пакета убраны build-артефакты репозитория —
          # сборщик (\.mjs$) и конфиг tsc (tsconfig\.json$) нужны репозиторию, а не
          # пользователю, и в рантайме расширения не участвуют.
          # Phase 3 step 1: dist/ стал самодостаточным, поэтому legacy-дерево исходников
          # уходит из пакета. ^core/ и ^utils/ безопасны: все их файлы либо склеены в
          # бандлы, либо перечислены в runtimeRegisteredFiles() и попадают в ZIP оверлеем
          # dist/ (20 MAIN-world файлов, которые service worker регистрирует сам).
          # Phase 3 step 6: кластер парсеров кадра вынесен в core/gemini-parse.js,
          # поэтому runtime-файлов стало на один больше (было 18, стало 19) —
          # сам исключающий фильтр ниже не менялся, файл приходит оверлеем dist/.
          # Phase 3 step 9: SSE-кластер вынесен в core/gemini-sse.js — снова +1
          # (было 19, стало 20); фильтр и здесь не тронут.
          # options/options\.js$ и ^print/print\.js$ исключены как бандлируемые входы:
          # оверлей кладёт их бандлы в корень пакета (options.js, print.js), а сами
          # HTML-страницы подменяются rewired-копиями из dist/.
          # Phase 3 step 3: privacy/privacy.html и docs/index.html больше не грузят
          # options/i18n-apply.js — они переведены на бандл dist/shared-i18n.js, поэтому
          # файл выходит из пакета отдельной ступенью конвейера (см. ниже), а не правкой
          # регулярки: фильтрующую строку ниже пинуют тесты M-6 (гигиена релиза) и M-10
          # («ровно одна такая строка», набор токенов), поэтому её текст не изменён.
          git ls-files -z | grep -zvE '(\.github/|\.gitignore|\.gitattributes|\.clineignore|tools/|tests/|^core/|^utils/|^adapters/|^options/options\.js$|^print/print\.js$|\.kilo/|coverage/|\.mjs$|tsconfig\.json$|\.md$|package(-lock)?\.json$)' | grep -zvxF 'options/i18n-apply.js' | xargs -0 zip -q "$ZIP"
          # v2.0.14 (Phase 2 step 2): поверх legacy-дерева кладём собранные бандлы.
          # Пути передаются так же — относительно корня репозитория, поэтому
          # одноимённые записи (manifest.json, options/options.html, print/print.html,
          # privacy/privacy.html, docs/index.html) ЗАМЕНЯЮТ legacy-копии, а бандлы
          # (background.js, content.js, options.js, print.js, shared-i18n.js),
          # docs/screenshots/ и _locales/ появляются в корне пакета. Именно rewired-копии
          # manifest.json и четырёх страниц определяют, что запускает Chrome:
          # 5 бандлов + 18 MAIN-world файлов, которые service worker регистрирует сам.
          # Файлы перечисляются find-ом (а не 'zip -r dist'), чтобы записи в архиве
          # гарантированно не получили префикс 'dist/' и совпали с legacy-именами.
          ( cd dist && find . -type f ) | sed 's|^\./||' | xargs zip -q "$ZIP"

      # Phase 3 step 2: инвариант состава JS в пакете. Шаг ниже ручается за то, что
      # ЗАПРЕЩЁННЫХ путей нет; этот — за то, что все .js в архиве ИЗВЕСТНЫ. Это две
      # независимые ошибки: фильтр может вычистить tests/ и всё равно пропустить
      # случайный корневой скрипт, а оверлей dist/ — не доложить runtime-файл.
      #
      # Проверка идёт по фактическому архиву (unzip -Z1), а не по симуляции
      # исключающего фильтра: симуляция дублировала бы регулярку исключений и
      # разошлась бы с ней при первой же правке (а тест M-6 требует ровно одну
      # такую строку), тогда как проверка артефакта ловит и фильтр, и оверлей сразу.
      #
      # Алгоритм:
      #   1) allowlist = источник истины, а не список в коде: все .js из собранного
      #      dist/ (в архиве они лежат без префикса dist/, поэтому './' снимается
      #      sed-ом) + любые собственные .js в docs/ и privacy/ (сегодня таких нет —
      #      правило на будущее, чтобы добавление скрипта в руководство не валило
      #      релиз). Phase 3 step 3: легаси-файл options/i18n-apply.js из allowlist
      #      УБРАН — privacy/privacy.html и docs/index.html переведены на бандл
      #      dist/shared-i18n.js, а сам файл вырезается из архива ступенью
      #      grep -zvxF в шаге Create ZIP. Его появление в архиве = регрессия;
      #   2) берём все .js из архива (unzip -Z1) и вычитаем allowlist
      #      (grep -vxF -f — точное совпадение целой строки, не подстрока);
      #   3) непустая разность = неожиданный файл → exit 1 с его путём; нулевое
      #      число .js в архиве — тоже ошибка (сломан фильтр или оверлей dist/).
      - name: Verify ZIP integrity
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ZIP="ai-context-monitor-v${VERSION}.zip"
          ALLOW="$RUNNER_TEMP/js-allowlist.txt"

          echo "--- (1) allowlist ---"
          ( cd dist && find . -type f -name '*.js' ) | sed 's|^\./||' > "$ALLOW"
          find docs privacy -type f -name '*.js' 2>/dev/null >> "$ALLOW" || true
          sort "$ALLOW"

          echo "--- (2) .js in $ZIP ---"
          JS_IN_ZIP=$(unzip -Z1 "$ZIP" | grep -E '\.js$' | sort || true)
          TOTAL=$(printf '%s\n' "$JS_IN_ZIP" | grep -c . || true)
          printf '%s\n' "$JS_IN_ZIP"
          echo "total: $TOTAL (allowlist: $(wc -l < "$ALLOW"))"

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::в ZIP нет ни одного .js — сломан фильтр исключений или оверлей dist/"
            exit 1
          fi

          echo "--- (3) разность: .js в архиве, которых нет в allowlist ---"
          UNEXPECTED=$(printf '%s\n' "$JS_IN_ZIP" | grep -vxF -f "$ALLOW" || true)
          if [ -n "$UNEXPECTED" ]; then
            printf '%s\n' "$UNEXPECTED" | while IFS= read -r f; do
              echo "::error::Unexpected JS file in package: $f. Add to allowlist or exclude in grep filter."
            done
            exit 1
          fi

          echo "OK: JS integrity — все $TOTAL .js в пакете известны (allowlist: $(wc -l < "$ALLOW") путей)"

      - name: Verify ZIP contents
        run: |
          # v1.19 (M-6): пост-шаг контроля состава пакета. Печатаем полный листинг ZIP
          # и падаем, если внутрь просочились служебные пути (tests/, node_modules/,
          # .git/, package-lock.json). Дополнительно требуем наличие руководства:
          # без docs/index.html ссылка «Помощь» в options-футере неработоспособна.
          ZIP="ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip"
          unzip -l "$ZIP"
          echo "--- forbidden paths ---"
          if unzip -Z1 "$ZIP" | grep -E '(^|/)(tests|node_modules|\.git)/|(^|/)package-lock\.json$'; then
            echo "::error::ZIP содержит запрещённые пути (tests/, node_modules/, .git/, package-lock.json)"
            exit 1
          fi
          echo "--- required guide ---"
          if ! unzip -Z1 "$ZIP" | grep -qx 'docs/index.html'; then
            echo "::error::в ZIP нет docs/index.html — руководство недоступно из расширения"
            exit 1
          fi
          echo "OK: состав пакета $ZIP проверен"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: ai-context-monitor-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}