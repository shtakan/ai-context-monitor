name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Scheduled, not a PR gate: a new upstream advisory must not block
      # unrelated pull requests, but it must be visible in Actions.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
